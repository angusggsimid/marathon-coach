name: Refresh Race Data

on:
  schedule:
    # Every Monday at 02:00 UTC (10:00 Beijing time)
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: crawler/package-lock.json

      - name: Install crawler dependencies
        run: npm ci
        working-directory: crawler

      - name: Run scraper
        run: npm run scrape
        working-directory: crawler

      - name: Export races to public/races.json
        run: |
          node --input-type=commonjs << 'EOF'
          const fs = require('fs');
          const races = JSON.parse(fs.readFileSync('crawler/output/scraped-races.json', 'utf8'));
          const out = {
            generatedAt: new Date().toISOString(),
            races: Array.isArray(races) ? races : []
          };
          fs.writeFileSync('public/races.json', JSON.stringify(out, null, 2));
          console.log('Exported', out.races.length, 'races to public/races.json');
          EOF

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/races.json
          git diff --staged --quiet || git commit -m "chore: refresh race data [skip ci]"
          git push
