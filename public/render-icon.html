<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden}</style></head>
<body>
<img id="i" src="./icon-master.svg" width="512" height="512">
<script>
  const s = Number(new URLSearchParams(location.search).get('s') || '512');
  const img = document.getElementById('i');
  img.width = s; img.height = s;
  document.body.style.width = s + 'px';
  document.body.style.height = s + 'px';
</script>
</body></html>
